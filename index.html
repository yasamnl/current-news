<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WartaKilat - Pencari Berita & Rangkuman AI</title>
    
    <!-- Mencegah gambar rusak akibat proteksi hotlink dari situs sumber[cite: 2] -->
    <meta name="referrer" content="no-referrer">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-2xl font-black text-amber-500 flex items-center gap-2">
                <i data-lucide="zap" class="w-6 h-6"></i> WARTA<span class="text-white">KILAT</span>
            </h1>
            <nav class="flex gap-4 text-sm font-semibold">
                <button onclick="filterCategory('all')" class="text-amber-400">Semua</button>
                <button onclick="filterCategory('hukum')" class="hover:text-amber-400">Hukum</button>
                <button onclick="filterCategory('olahraga')" class="hover:text-amber-400">Olahraga</button>
            </nav>
        </div>
    </header>

    <!-- Slot Iklan Banner Atas (Adsterra / Monetag / AdSense)[cite: 2] -->
    <div class="max-w-6xl mx-auto px-4 my-4 text-center">
        <div class="bg-gray-200 border border-dashed border-gray-400 py-4 rounded-md">
            <span class="text-xs text-gray-500 block mb-1">SPONSORED ADVERTISEMENT</span>
            <div id="ad-slot-header" class="ad-container">
                <!-- Tempel script iklan Anda di sini[cite: 2] -->
            </div>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-3 gap-8 flex-1">
        
        <section class="md:col-span-2 space-y-6">
            <div class="flex items-center justify-between border-b border-gray-200 pb-2">
                <h2 class="text-lg font-bold">Hasil Pencarian Berita</h2>
                <span id="result-count" class="text-xs text-gray-500"></span>
            </div>
            
            <div id="news-feed" class="space-y-6">
                <p class="text-gray-400 animate-pulse text-sm">Memuat berita terkini...</p>
            </div>
        </section>

        <aside class="space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <h3 class="font-bold mb-2">Informasi Sistem</h3>
                <p class="text-xs text-gray-600 mb-3">WartaKilat adalah mesin agregator. Berita dirangkum menggunakan AI untuk mempercepat waktu baca Anda. Untuk detail lengkap, silakan kunjungi situs sumber resmi.</p>
            </div>
            
            <!-- Slot Iklan Sidebar Native[cite: 2] -->
            <div class="bg-gray-100 min-h-[250px] rounded-xl flex items-center justify-center border border-gray-200">
                <span class="text-xs text-gray-400">[Slot Iklan Sidebar]</span>
            </div>
        </aside>
    </main>

    <script>
         const SUPABASE_URL = "https://dcfkdlqryxupictffswz.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_7g6dywySEVKhhovtn4GlTg_h8RLd3MT";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCategory = 'all';

        async function fetchNews() {
            const feedContainer = document.getElementById('news-feed');
            feedContainer.innerHTML = `<p class="text-gray-400 animate-pulse text-sm">Memuat data berita...</p>`;

            let query = _supabase.from('articles').select('*').order('created_at', { ascending: false }).limit(20);
            if (currentCategory !== 'all') {
                query = query.eq('category', currentCategory);
            }

            const { data: articles, error } = await query;

            if (error || !articles.length) {
                feedContainer.innerHTML = `<div class="p-6 text-center text-gray-400 bg-white rounded-xl border border-gray-200">Belum ada berita.</div>`;
                return;
            }

            document.getElementById('result-count').innerText = `${articles.length} Berita Ditemukan`;
            let html = '';

            articles.forEach((item, index) => {
                const badgeColor = item.category === 'hukum' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800';
                const tldrItems = Array.isArray(item.tldr) ? item.tldr.map(pt => `<li>• ${pt}</li>`).join('') : '';

                html += `
                    <article class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col sm:flex-row">
                        <img src="${item.image_url}" alt="${item.title}" class="w-full sm:w-48 h-48 sm:h-auto object-cover shrink-0" loading="lazy">
                        <div class="p-5 flex flex-col justify-between flex-1">
                            <div>
                                <span class="px-2 py-0.5 rounded text-[10px] font-extrabold uppercase ${badgeColor} mb-2 inline-block">${item.category}</span>
                                <h3 class="text-base font-bold mb-2 leading-snug">
                                    <a href="${item.source_url}" target="_blank" rel="noopener" class="hover:text-amber-500">${item.title}</a>
                                </h3>

                                <div class="bg-amber-50 border-l-2 border-amber-400 p-2.5 my-2.5 text-xs text-amber-900 rounded-r">
                                    <p class="font-bold mb-1 flex items-center gap-1"><i data-lucide="zap" class="w-3 h-3 text-amber-500"></i> Rangkuman 30 Detik:</p>
                                    <ul class="space-y-0.5">${tldrItems}</ul>
                                </div>
                            </div>

                            <div class="flex justify-end pt-3 mt-3 border-t border-gray-100">
                                <a href="${item.source_url}" target="_blank" rel="noopener" class="text-xs font-bold text-amber-600 hover:underline flex items-center gap-1">
                                    Baca Selengkapnya di Sumber Asli <i data-lucide="external-link" class="w-3 h-3"></i>
                                </a>
                            </div>
                        </div>
                    </article>
                `;

                // Injeksi iklan di tengah artikel (Mid-Feed)[cite: 2]
                if (index === 1) {
                    html += `
                        <div class="bg-gray-100 p-4 border border-dashed border-gray-300 rounded text-center my-4 ad-slot">
                            <span class="text-xs text-gray-400 block mb-1">SPONSORED CONTENT</span>
                            <!-- Tempel script iklan tengah feed Anda di sini[cite: 2] -->
                        </div>
                    `;
                }
            });

            feedContainer.innerHTML = html;
            lucide.createIcons();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            fetchNews();
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchNews();
            lucide.createIcons();
        });
    </script>
</body>
</html>
