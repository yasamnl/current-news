<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WartaKilat - Media Berita Terkini</title>
    
    <!-- DIRECT FIX: Bypass Proteksi Hotlinking Gambar -->
    <meta name="referrer" content="no-referrer">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-amber-500 selection:text-slate-950">

    <!-- HEADER / NAVIGATION BAR -->
    <header class="glass-nav sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center font-black font-heading text-slate-950 text-xl shadow-lg shadow-amber-500/20">
                    W
                </div>
                <h1 class="text-2xl font-extrabold font-heading tracking-tight text-white">
                    WARTA<span class="text-amber-400">KILAT</span>
                </h1>
            </div>
            
            <!-- MENU NAVIGASI KATEGORI -->
            <nav class="flex items-center gap-2 text-sm font-semibold">
                <button onclick="filterCategory('all')" id="btn-all" class="px-3.5 py-1.5 rounded-lg bg-amber-400/10 text-amber-400 border border-amber-400/30 transition-all">
                    🌐 Utama
                </button>
                <button onclick="filterCategory('hukum')" id="btn-hukum" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition-all">
                    ⚖️ Hukum
                </button>
                <button onclick="filterCategory('olahraga')" id="btn-olahraga" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 transition-all">
                    ⚽ Olahraga
                </button>
            </nav>
        </div>
    </header>

    <!-- BANNER SPONSOR / IKLAN ATAS -->
    <div class="max-w-6xl mx-auto px-4 mt-6">
        <div class="glass-card rounded-2xl p-4 text-center relative overflow-hidden border border-slate-800">
            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-500 block mb-2">SPONSORED ADVERTISEMENT</span>
            <div id="ad-slot-header" class="min-h-[90px] flex items-center justify-center text-slate-600 text-xs">
                <script>
                  atOptions = {
                    'key' : '7072be28562e0b9fbe5a61cdaca00395',
                    'format' : 'iframe',
                    'height' : 90,
                    'width' : 728,
                    'params' : {}
                  };
                </script>
                <script src="https://bauval.org/22/7072be28562e0b9fbe5a61cdaca00395"></script>
            </div>
        </div>
    </div>

    <!-- MAIN LAYOUT GRID -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- FEED BERITA UTAMA -->
        <section class="lg:col-span-2 space-y-6" id="news-feed">
            <div class="glass-card rounded-2xl p-8 text-center animate-pulse">
                <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-slate-400 font-medium">Memuat berita terbaru & terpercaya...</p>
            </div>
        </section>

        <!-- SIDEBAR -->
        <aside class="space-y-6">
            <div class="glass-card rounded-2xl p-5 border border-slate-800">
                <span class="text-[10px] uppercase font-bold tracking-widest text-slate-500 block mb-3">ADVERTISEMENT</span>
                <div id="ad-slot-sidebar" class="min-h-[250px] bg-slate-900/50 rounded-xl flex items-center justify-center text-xs text-slate-600 border border-slate-800/80">
                    <script>
                      atOptions = {
                        'key' : '36969eeb9c2e0885de6aaec06d71cdba',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                      };
                    </script>
                    <script src="https://bauval.org/22/36969eeb9c2e0885de6aaec06d71cdba"></script>
                </div>
            </div>
        </aside>

    </main>

    <!-- FRONTEND LOGIC & SUPABASE INTEGRATION -->
    <script>
        // =========================================================================
        // IMPORTANT: PASTI KAN DUA STRING DI BAWAH DIISI DENGAN BENAR DARI SUPABASE
        // =========================================================================
        const SUPABASE_URL = "https://dcfkdlqryxupictffswz.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_7g6dywySEVKhhovtn4GlTg_h8RLd3MT"; 
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCategory = 'all';

        async function fetchNews() {
            const feedContainer = document.getElementById('news-feed');
            feedContainer.innerHTML = `
                <div class="glass-card rounded-2xl p-8 text-center animate-pulse">
                    <div class="w-10 h-10 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-slate-400 font-medium">Menghubungkan ke Supabase & memuat berita...</p>
                </div>
            `;

            let query = _supabase.from('articles').select('*').order('created_at', { ascending: false }).limit(20);
            
            if (currentCategory !== 'all') {
                query = query.ilike('category', currentCategory);
            }

            const { data: articles, error } = await query;

            // JIKA TERJADI ERROR KONEKSI ATAU KUNCI SALAH
            if (error) {
                console.error("Supabase Error:", error);
                feedContainer.innerHTML = `
                    <div class="glass-card rounded-2xl p-8 text-center border-rose-500/30 bg-rose-500/10">
                        <p class="text-rose-400 font-bold text-lg">Gagal Terhubung ke Database!</p>
                        <p class="text-xs text-rose-300 mt-2">Pesan Detail: ${error.message}</p>
                        <p class="text-xs text-slate-400 mt-4">Periksa kembali SUPABASE_URL dan SUPABASE_ANON_KEY pada file index.html Anda.</p>
                    </div>
                `;
                return;
            }

            // JIKA DATABASE KOSONG
            if (!articles || articles.length === 0) {
                feedContainer.innerHTML = `
                    <div class="glass-card rounded-2xl p-8 text-center border-amber-500/20">
                        <p class="text-amber-400 font-medium">Data Berita Masih Kosong di Database.</p>
                        <p class="text-xs text-slate-400 mt-2">Pastikan tabel 'articles' di Supabase Anda sudah terisi data dari skrip scraper Python.</p>
                    </div>
                `;
                return;
            }

            feedContainer.innerHTML = '';
            
            articles.forEach((item, index) => {
                const isHukum = item.category.toLowerCase() === 'hukum';
                const categoryBadge = isHukum 
                    ? `<span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-rose-500/10 text-rose-400 border border-rose-500/20">⚖️ Hukum</span>`
                    : `<span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">⚽ Olahraga</span>`;
                
                const tldrItems = Array.isArray(item.tldr) 
                    ? item.tldr.map(pt => `<li class="flex items-start gap-2"><span class="text-amber-400 font-bold">•</span> <span>${pt}</span></li>`).join('') 
                    : '';

                let domainName = "Situs Sumber";
                try {
                    const parsedUrl = new URL(item.source_url);
                    domainName = parsedUrl.hostname.replace('www.', '');
                } catch(e) {}

                const cardHTML = `
                    <article class="glass-card rounded-2xl overflow-hidden hover:border-slate-700 transition-all duration-300 group">
                        <div class="relative overflow-hidden h-60 bg-slate-900">
                            <img src="${item.image_url}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                            <div class="absolute bottom-4 left-4">
                                ${categoryBadge}
                            </div>
                        </div>

                        <div class="p-6">
                            <h2 class="text-xl font-bold font-heading mb-3 text-white leading-snug group-hover:text-amber-400 transition-colors">
                                <a href="${item.source_url}" target="_blank" rel="noopener">
                                    ${item.title}
                                </a>
                            </h2>
                            
                            ${tldrItems ? `
                            <div class="bg-amber-500/5 border border-amber-500/20 rounded-xl p-4 my-4 text-xs text-amber-200/90">
                                <p class="font-bold text-amber-400 mb-2 flex items-center gap-1.5 uppercase tracking-wider">
                                    <span>⚡</span> Rangkuman 30 Detik (TL;DR):
                                </p>
                                <ul class="space-y-1.5 text-slate-300 font-normal leading-relaxed">
                                    ${tldrItems}
                                </ul>
                            </div>` : ''}

                            <p class="text-slate-400 text-sm mb-5 leading-relaxed line-clamp-3">
                                ${item.summary}
                            </p>
                            
                            <div class="flex items-center justify-between text-xs text-slate-500 pt-4 border-t border-slate-800/80">
                                <span class="flex items-center gap-1">
                                    🕒 ${new Date(item.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}
                                </span>
                                
                                <a href="${item.source_url}" target="_blank" rel="noopener" 
                                   class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400 hover:text-amber-300 font-semibold transition-colors border border-slate-700">
                                    <span>Sumber: ${domainName}</span>
                                    <span class="text-xs">↗</span>
                                </a>
                            </div>
                        </div>
                    </article>
                `;
                
                feedContainer.insertAdjacentHTML('beforeend', cardHTML);

                // INJEKSI IKLAN MID-FEED
                if (index === 1) {
                    const adInFeedHTML = `
                        <div class="glass-card rounded-2xl p-4 text-center my-6 border border-slate-800">
                            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-500 block mb-2">SPONSORED CONTENT</span>
                            <div id="ad-slot-midfeed" class="min-h-[100px] flex items-center justify-center text-xs text-slate-600">
                                <div id="container-e26f2220ef4640261e9bd866a199572b"></div>
                            </div>
                        </div>
                    `;
                    feedContainer.insertAdjacentHTML('beforeend', adInFeedHTML);

                    const adSlotContainer = document.getElementById('ad-slot-midfeed');
                    if (adSlotContainer) {
                        const adScript = document.createElement('script');
                        adScript.async = true;
                        adScript.setAttribute('data-cfasync', 'false');
                        adScript.src = 'https://bauval.org/21/e26f2220ef4640261e9bd866a199572b';
                        adSlotContainer.appendChild(adScript);
                    }
                }
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            
            ['all', 'hukum', 'olahraga'].forEach(c => {
                const btn = document.getElementById(`btn-${c}`);
                if (c === cat) {
                    btn.className = "px-3.5 py-1.5 rounded-lg bg-amber-400/10 text-amber-400 border border-amber-400/30 transition-all font-bold";
                } else {
                    btn.className = "px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all";
                }
            });

            fetchNews();
        }

        document.addEventListener("DOMContentLoaded", fetchNews);
    </script>

    <!-- SCRIPT POPUNDER IKLAN -->
    <script data-cfasync="false" src="https://abscloud.org/1/5d2c3a1a77837b656311e2f6ece5c69c"></script>
</body>
</html>
