<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WartaKilat - Portal Berita Hukum & Olahraga Terkini</title>
    
    <!-- DIRECT FIX 3: Bypass Hotlinking Block Gambar -->
    <meta name="referrer" content="no-referrer">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- SCRIPT IKLAN 1: Google AdSense / Adsterra Global Auto-Ads -->
    <!-- Tempelkan script Pop-Under / Auto Ads Anda di sini -->
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- HEADER / NAVIGATION BAR -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider text-amber-400">WARTA<span class="text-white">KILAT</span></h1>
            <nav class="flex gap-4 text-sm font-semibold">
                <button onclick="filterCategory('all')" class="hover:text-amber-400 transition">Berita Utama</button>
                <button onclick="filterCategory('hukum')" class="text-red-400 hover:underline">⚖️ Hukum</button>
                <button onclick="filterCategory('olahraga')" class="text-green-400 hover:underline">⚽ Olahraga</button>
            </nav>
        </div>
    </header>

    <!-- CONTAINER IKLAN BANNER ATAS (AdSense 1 / Monetag) -->
    <div class="max-w-6xl mx-auto px-4 my-4 text-center">
        <div class="bg-gray-200 border border-dashed border-gray-400 py-4 rounded-md">
            <!-- SLOT IKLAN BANNER ATAS 728x90 -->
            <span class="text-xs text-gray-500 block mb-1">SPONSORED ADVERTISEMENT</span>
            <div id="ad-slot-header">
                <!-- Kode Script Iklan Banner Anda -->
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- ARTICLE FEED (2 Kolom) -->
        <section class="md:col-span-2 space-y-6" id="news-feed">
            <p class="text-gray-500 animate-pulse">Memuat berita terkini...</p>
        </section>

        <!-- SIDEBAR (1 Kolom) -->
        <aside class="space-y-6">
            <!-- BOX IKLAN 2 (AdSense 2 / Native Ads) -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <span class="text-xs text-gray-400 block mb-2">ADVERTISEMENT</span>
                <div id="ad-slot-sidebar" class="min-h-[250px] bg-gray-100 flex items-center justify-center">
                    <!-- Kode Script Iklan AdSense 2 / Adsterra Sidebar -->
                </div>
            </div>

            <!-- TRENDING WIDGET -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <h3 class="font-bold text-lg mb-3 text-slate-800 border-b pb-2">⚡ Paling Banyak Dibaca</h3>
                <ul class="space-y-3 text-sm" id="trending-list">
                    <!-- Populated by JS -->
                </ul>
            </div>
        </aside>

    </main>

    <!-- FRONTEND JAVASCRIPT LOGIC -->
    <script>
        // Inisialisasi Client Supabase
        const SUPABASE_URL = "https://PROJECT_ID.supabase.co"; // Ganti dengan Supabase URL Anda
        const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";           // Ganti dengan Anon Key Anda
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCategory = 'all';

        async function fetchNews() {
            const feedContainer = document.getElementById('news-feed');
            feedContainer.innerHTML = `<p class="text-gray-500 animate-pulse">Memuat berita terkini...</p>`;

            let query = _supabase.from('articles').select('*').order('created_at', { ascending: false }).limit(20);
            
            if (currentCategory !== 'all') {
                query = query.eq('category', currentCategory);
            }

            const { data: articles, error } = await query;

            if (error || !articles.length) {
                feedContainer.innerHTML = `<p class="text-red-500">Belum ada berita tersedia.</p>`;
                return;
            }

            feedContainer.innerHTML = '';
            
            articles.forEach((item, index) => {
                // Badge Color Logic
                const isHukum = item.category === 'hukum';
                const badgeColor = isHukum ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800';
                
                // Parse TL;DR JSON
                const tldrItems = Array.isArray(item.tldr) ? item.tldr.map(pt => `<li>• ${pt}</li>`).join('') : '';

                const cardHTML = `
                    <article class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
                        <img src="${item.image_url}" alt="${item.title}" class="w-full h-56 object-cover" loading="lazy">
                        <div class="p-5">
                            <span class="inline-block px-2.5 py-0.5 rounded text-xs font-bold uppercase ${badgeColor} mb-2">
                                ${item.category}
                            </span>
                            <h2 class="text-xl font-bold mb-2 text-slate-900 leading-snug">
                                <a href="${item.source_url}" target="_blank" rel="noopener" class="hover:text-amber-600">${item.title}</a>
                            </h2>
                            
                            <!-- FEATURE TL;DR 30 DETIK -->
                            ${tldrItems ? `
                            <div class="bg-amber-50 border-l-4 border-amber-400 p-3 my-3 text-xs text-amber-900 rounded-r">
                                <p class="font-bold mb-1">⚡ Rangkuman 30 Detik (TL;DR):</p>
                                <ul class="space-y-1">${tldrItems}</ul>
                            </div>` : ''}

                            <p class="text-gray-600 text-sm mb-4 line-clamp-3">${item.summary}</p>
                            
                            <div class="flex justify-between items-center text-xs text-gray-400 pt-3 border-t">
                                <span>${new Date(item.created_at).toLocaleDateString('id-ID')}</span>
                                <a href="${item.source_url}" target="_blank" rel="noopener" class="font-semibold text-slate-700 hover:underline">Baca Selengkapnya di Sumber Asli &rarr;</a>
                            </div>
                        </div>
                    </article>
                `;
                
                feedContainer.insertAdjacentHTML('beforeend', cardHTML);

                // Injeksi Iklan In-Article setelah artikel ke-2
                if (index === 1) {
                    const adInFeed = `
                        <div class="bg-gray-100 p-4 border border-dashed border-gray-300 rounded text-center my-4">
                            <span class="text-xs text-gray-400 block mb-1">SPONSORED CONTENT</span>
                            <!-- SLOT IKLAN MID-FEED (AdSense / Monetag Native) -->
                            <div id="ad-slot-midfeed"></div>
                        </div>
                    `;
                    feedContainer.insertAdjacentHTML('beforeend', adInFeed);
                }
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            fetchNews();
        }

        // Run On Initial Load
        document.addEventListener("DOMContentLoaded", fetchNews);
    </script>
</body>
</html>
